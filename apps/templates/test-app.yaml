{{ if index .Values "test-app" "enabled" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-app
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd-image-updater.argoproj.io/image-list: ghcr.io/your-username/ci-test-app
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/TomeuUris/k3s-gitops.git
    path: charts/test-app
    targetRevision: {{ index .Values "test-app" "chart_revision" }}
    helm:
      values: {{ toYaml (index .Values "test-app" "values") | nindent 8 }}
  destination:
    namespace: test-app
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
{{ end }}