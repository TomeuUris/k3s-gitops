{{ if index .Values "cert-manager" "enabled" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-app
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TomeuUris/k3s-gitops.git
    path: charts/cert-manager
    targetRevision: {{ index .Values "cert-manager" "chart_revision" }}
    helm:
      values: |
{{ toYaml (index .Values "cert-manager" "values") | nindent 8 }}
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
{{ end }}