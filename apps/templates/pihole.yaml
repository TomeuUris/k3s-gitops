{{ if .Values.pihole.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TomeuUris/k3s-gitops.git
    path: charts/pihole
    targetRevision: {{ .Values.pihole.chart_revision }}
    helm:
      values: {{ toYaml .Values.pihole.values | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
{{ end }}