{{ if index .Values "code-server" "enabled" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: code-server
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TomeuUris/k3s-gitops.git
    path: charts/code-server
    targetRevision: {{ index .Values "code-server" "chart_revision" }}
    helm:
      values: {{ toYaml (index .Values "code-server" "values") | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: code-server
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
{{ end }}