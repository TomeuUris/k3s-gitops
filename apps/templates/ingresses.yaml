{{ if .Values.ingresses.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingresses
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TomeuUris/k3s-gitops.git
    path: charts/ingresses
    targetRevision: {{ .Values.ingresses.chart_revision }}
    helm:
      values: |
{{ toYaml .Values.ingresses.values | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
{{ end }}