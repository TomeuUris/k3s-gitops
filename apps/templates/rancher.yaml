{{ if .Values.rancher.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher-app
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: rancher
    repoURL: https://releases.rancher.com/server-charts/stable
    targetRevision: {{ .Values.rancher.chart_revision }}
    helm:
      values: {{ toYaml .Values.rancher.values | nindent 8 }}
  destination:
    namespace: cattle-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
{{ end }}