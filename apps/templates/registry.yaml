{{ if .Values.registry.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Public chart
    - repoURL: {{ .Values.global.public_repo_url }}
      path: charts/registry
      targetRevision: {{ .Values.registry.chart_revision }}
      helm:
        valueFiles:
          - $values/{{ .Values.registry.values_file }}
    # Private values
    - repoURL: {{ .Values.global.private_repo_url }}
      targetRevision: {{ .Values.global.private_repo_revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
{{ end }}