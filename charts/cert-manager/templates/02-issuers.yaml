{{ range .Values.issuers }}
{{ if .enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    server: {{ .server }}
    email: {{ .email }}
    privateKeySecretRef:
      name: {{ .privateKeySecretRef }}
    solvers: {{- toYaml .solvers | nindent 6 }}
{{ end }}
{{ end }}