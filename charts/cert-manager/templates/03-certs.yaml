{{ range .Values.certs }}
{{ if .enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ .secretNamespace }}
spec:
  secretName: {{ .secretName }}
  issuerRef:
    name: {{ .issuer }}
    kind: ClusterIssuer
  commonName: "{{ .commonName }}"
  dnsNames: 
    {{- toYaml .dnsNames | nindent 4 }}
{{ end }}
{{ end }}