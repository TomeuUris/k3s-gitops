---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Values.truenas.service }}
  namespace: {{ .Values.truenas.namespace }}
subsets:
- addresses:
  - ip: {{ .Values.truenas.externalIp }}
  ports:
  - name: {{ .Values.truenas.service }}
    port: {{ .Values.truenas.targetPort }}
    protocol: TCP
