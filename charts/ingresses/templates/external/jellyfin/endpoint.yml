---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Values.jellyfin.service }}
  namespace: {{ .Values.jellyfin.namespace }}
subsets:
- addresses:
  - ip: {{ .Values.jellyfin.externalIp }}
  ports:
  - name: {{ .Values.jellyfin.service }}
    port: {{ .Values.jellyfin.targetPort }}
    protocol: TCP
