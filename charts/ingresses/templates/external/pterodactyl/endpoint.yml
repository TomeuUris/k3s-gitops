---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Values.pterodactyl.service }}
  namespace: {{ .Values.pterodactyl.namespace }}
subsets:
- addresses:
  - ip: {{ .Values.pterodactyl.externalIp }}
  ports:
  - name: {{ .Values.pterodactyl.service }}
    port: {{ .Values.pterodactyl.targetPort }}
    protocol: TCP
