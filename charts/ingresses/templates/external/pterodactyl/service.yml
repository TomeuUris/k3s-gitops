apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.pterodactyl.service }}
  namespace: {{ .Values.pterodactyl.namespace }}
spec:
  ports:
  - name: {{ .Values.pterodactyl.service }}
    port: {{ .Values.pterodactyl.port }}
    protocol: TCP
    targetPort: {{ .Values.pterodactyl.targetPort }}
  clusterIP: None