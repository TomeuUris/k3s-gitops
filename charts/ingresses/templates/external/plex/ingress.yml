apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: plex-external
  namespace: {{ .Values.plex.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressClass }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.plex.host }}.{{ .Values.baseUri }}`)
      kind: Rule
      services:
        - name: {{ .Values.plex.service }}
          port: {{ .Values.plex.port }}
  tls: {}