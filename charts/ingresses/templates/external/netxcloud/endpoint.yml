---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Values.nextcloud.service }}
  namespace: {{ .Values.nextcloud.namespace }}
subsets:
- addresses:
  - ip: {{ .Values.nextcloud.externalIp }}
  ports:
  - name: {{ .Values.nextcloud.service }}
    port: {{ .Values.nextcloud.targetPort }}
    protocol: TCP
