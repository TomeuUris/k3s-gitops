apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-external
  namespace: {{ .Values.nextcloud.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressClass }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.nextcloud.host }}.{{ .Values.baseUri }}`)
      kind: Rule
      services:
        - name: {{ .Values.nextcloud.service }}
          port: {{ .Values.nextcloud.targetPort }}
      # middlewares:
      #   - name: nextcloud-headers # Apply the middleware
  tls: {}