---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Values.pfsense.service }}
  namespace: {{ .Values.pfsense.namespace }}
subsets:
- addresses:
  - ip: {{ .Values.pfsense.externalIp }}
  ports:
  - name: {{ .Values.pfsense.service }}
    port: {{ .Values.pfsense.targetPort }}
    protocol: TCP
