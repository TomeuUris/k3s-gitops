apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole-dashboard
  namespace: {{ .Values.pihole.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressClass }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.pihole.host }}.{{ .Values.baseUri }}`)
      kind: Rule
      services:
        - name: {{ .Values.pihole.service }}
          port: {{ .Values.pihole.port }}
  tls: {}

