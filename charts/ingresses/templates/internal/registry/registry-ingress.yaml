---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry
  namespace: {{ .Values.registry.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressClass }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.registry.host }}.{{ .Values.baseUri }}`)
      kind: Rule
      services:
        - name: {{ .Values.registry.service }}
          port: {{ .Values.registry.port }}
  tls: {}
