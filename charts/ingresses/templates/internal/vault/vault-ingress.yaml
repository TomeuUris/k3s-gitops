---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-ui
  namespace: {{ .Values.vault.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressClass }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.vault.host }}.{{ .Values.baseUri }}`)
      kind: Rule
      services:
        - name: {{ .Values.vault.service }}
          port: {{ .Values.vault.port }}
  tls: {}
